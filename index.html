<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GTA Indonesia — Cirebon</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 4px #000}
.box{background:#0009;border:1px solid #fff3;border-radius:12px;padding:8px 10px}
#mission{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 14px;border-radius:14px;text-align:center;font-size:13px}
#controls{position:fixed;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-between;pointer-events:none}
.pad,.actions{display:grid;gap:7px;pointer-events:auto}.pad{grid-template-columns:repeat(3,52px)}.actions{grid-template-columns:repeat(2,62px)}
button{height:52px;border:1px solid #fff5;border-radius:14px;background:#111b;color:#fff;font-size:18px;font-weight:700;touch-action:none}
.spacer{visibility:hidden}
@media(min-width:900px){button{opacity:.65}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="box">💵 Rp <span id="cash">150000</span><br>⭐ <span id="wanted">0</span>/5</div><div class="box">CIREBON<br><small id="mode">Jalan kaki</small></div></div>
<div id="mission">MISI 1 · ANTAR PAKET<br><small>Datangi titik kuning di sekitar Balai Kota</small></div>
<div id="controls">
<div class="pad"><span class="spacer"></span><button data-k="w">▲</button><span class="spacer"></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div class="actions"><button data-k="e">MASUK</button><button data-k="shift">NITRO</button><button data-k="r">REPAIR</button><button data-k="space">REM</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8fc8ee); scene.fog=new THREE.Fog(0x8fc8ee,90,300);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x446644,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(80,120,40); scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x3f7042)); ground.rotation.x=-Math.PI/2; scene.add(ground);
function cube(x,y,z,sx,sy,sz,c){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));m.position.set(x,y,z);scene.add(m);return m}
for(let x=-120;x<=120;x+=40){cube(x,.03,0,12,.06,280,0x444444);cube(x,.07,0,.35,.08,280,0xf1d85a)}
for(let z=-120;z<=120;z+=40){cube(0,.03,z,280,.06,12,0x444444);cube(0,.07,z,280,.08,.35,0xf1d85a)}
for(let x=-100;x<=100;x+=20)for(let z=-100;z<=100;z+=20){if(Math.abs(x%40)<8||Math.abs(z%40)<8)continue;let h=6+Math.random()*18;cube(x,h/2,z,12,h,12,[0xd6b08c,0xb7c9d9,0xd0d0c0,0xc59b79][Math.floor(Math.random()*4)])}
const landmark=cube(0,4,0,22,8,18,0xd6b24c); cube(0,9,0,12,2,10,0xf0e3bd);
const target=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.15,32),new THREE.MeshBasicMaterial({color:0xffd21a}));target.position.set(55,.15,55);scene.add(target);
const player=new THREE.Group(); const body=new THREE.Mesh(new THREE.CapsuleGeometry(1,2,6,10),mat(0x2468d8));body.position.y=2;player.add(body);player.position.set(18,0,18);scene.add(player);
let car=null,inCar=false, cash=150000,wanted=0, speed=0;
function makeCar(x,z,c=0xc72c2c){let g=new THREE.Group();g.add(cube(0,1,0,3.8,1.4,6,c));let w=mat(0x111111);for(let sx of [-1.7,1.7])for(let sz of [-2,2]){let q=new THREE.Mesh(new THREE.CylinderGeometry(.65,.65,.45,16),w);q.rotation.z=Math.PI/2;q.position.set(sx,.65,sz);g.add(q)}g.position.set(x,0,z);scene.add(g);return g}
for(let i=0;i<8;i++){let c=makeCar(-80+i*22,(i%2?55:-55),i%2?0xeeeeee:0xc72c2c);c.rotation.y=i%2?Math.PI:0}
car=makeCar(18,10,0x1d7c45);
function pressed(k){return keys.has(k)}
const keys=new Set();
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' '||e.key==='Shift')keys.add(e.key===' '?'space':'shift');if(e.key.toLowerCase()==='e')interact()});
addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());keys.delete(e.key===' '?'space':'shift')});
document.querySelectorAll('button[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=()=>keys.add(k);b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys.delete(k)});
function interact(){if(!inCar&&player.position.distanceTo(car.position)<8){inCar=true;player.visible=false;document.querySelector('#mode').textContent='Mengemudi'}else if(inCar){inCar=false;player.visible=true;player.position.copy(car.position).x+=4;document.querySelector('#mode').textContent='Jalan kaki'}}
function update(){let obj=inCar?car:player;let accel=(pressed('w')?1:0)-(pressed('s')?1:0);let steer=(pressed('a')?1:0)-(pressed('d')?1:0);
if(inCar){speed+=(accel*(pressed('shift')?0.055:0.025))-speed*.018;speed=Math.max(-.45,Math.min(.8,speed));car.rotation.y+=steer*speed*.035;car.translateZ(-speed*3)}else{let v=.32;player.translateZ(-accel*v);player.rotation.y+=steer*.06}
if(pressed('r'))speed*=.92;
let desired=new THREE.Vector3(0,8,14).applyQuaternion(obj.quaternion).add(obj.position);camera.position.lerp(desired,.12);camera.lookAt(obj.position.x,obj.position.y+1,obj.position.z);
if(obj.position.distanceTo(target.position)<7){cash+=50000;target.position.set(-55,-.1,-55);document.querySelector('#mission').innerHTML='MISI SELESAI · +Rp50.000<br><small>Jelajahi Cirebon</small>'}
document.querySelector('#cash').textContent=cash.toLocaleString('id-ID');document.querySelector('#wanted').textContent=wanted}
function loop(){requestAnimationFrame(loop);update();renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
