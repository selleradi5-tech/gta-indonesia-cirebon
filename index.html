<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif;touch-action:none}

#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;text-shadow:0 2px 4px #000;z-index:5}
.box{background:#000b;border:1px solid #fff3;border-radius:11px;padding:6px 8px;line-height:1.25;font-weight:700;backdrop-filter:blur(4px)}
#gps{position:fixed;left:10px;bottom:225px;background:#000c;border:1px solid #fff3;border-radius:12px;padding:8px 10px;font-size:12px;z-index:6;pointer-events:none;max-width:210px}#mission{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid #fff2;padding:6px 10px;border-radius:12px;text-align:center;font-size:11px;min-width:190px;max-width:52vw;z-index:5;pointer-events:none;white-space:nowrap}
#minimap{position:fixed;right:10px;top:62px;width:104px;height:104px;background:#122018e8;border:2px solid #fff8;border-radius:15px;overflow:hidden;z-index:5}
#map{width:100%;height:100%}#vehicleHud{position:fixed;left:10px;bottom:170px;background:#000c;border:1px solid #fff3;border-radius:14px;padding:8px 12px;min-width:135px;text-align:center;z-index:6;pointer-events:none;display:none;font-weight:800;text-shadow:0 2px 3px #000}#speed{font-size:21px}#vehicleControls{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;grid-template-columns:repeat(3,62px);gap:5px;z-index:7;pointer-events:none}.vbtn{pointer-events:auto;height:50px!important;border-radius:15px!important;background:#0b0b0dcc!important}.gas{grid-column:2/4!important;background:#176b2acc!important;font-size:12px!important}.brake{background:#7a2022cc!important}.reverse{background:#725515cc!important}@media(max-width:430px){#vehicleControls{grid-template-columns:repeat(3,60px)}.vbtn{height:52px!important}}#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#000d;border:1px solid #fff3;padding:9px 14px;border-radius:13px;opacity:0;transition:.2s;pointer-events:none;z-index:10;white-space:nowrap}
#controls{position:fixed;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;z-index:6;pointer-events:none}.actions button{height:42px;font-size:11px;padding:0 8px;border-radius:12px}.pad button{height:42px;font-size:13px}
.pad,.actions{display:grid;gap:7px;pointer-events:auto}.pad{grid-template-columns:repeat(3,54px)}.actions{grid-template-columns:repeat(3,56px)}
button{height:52px;border:1px solid #fff5;border-radius:14px;background:#111c;color:#fff;font-size:15px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;backdrop-filter:blur(5px)}
button:active{background:#fff3}.spacer{visibility:hidden}.hidden{display:none!important}
@media(max-width:430px){#minimap{width:108px;height:108px}.actions{grid-template-columns:repeat(3,58px)}button{height:48px;font-size:13px}.pad{grid-template-columns:repeat(3,50px)}#mission{top:72px;font-size:12px;min-width:220px}.box{font-size:12px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="box">💵 Rp <span id="cash">150.000</span><br>⛽ <span id="fuel">100</span>% · ⭐ <span id="wanted">0</span>/5<br>❤️ <span id="health">100</span>%</div>
 <div class="box">CIREBON<br><small id="area">Kota</small> · <small id="mode">Jalan kaki</small><br><small id="clock">12:00 Siang</small><br><small id="weather">☀️ Cerah</small></div>
</div>
<div id="gps">📍 GPS: <span id="gpsText">Menuju titik misi</span></div><div id="mission">MISI 1 · ANTAR PAKET<br><small id="missionText">Datangi titik kuning</small></div>
<div id="minimap"><canvas id="map" width="128" height="128"></canvas></div>

 <div class="pad"><span class="spacer"></span><button data-k="w">▲</button><span class="spacer"></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>

  <button id="btnEnter" data-action="enter">MASUK</button><button id="btnSteal" data-action="steal">AMBIL</button><button id="btnNitro" data-k="shift">NITRO</button><button id="btnRepair" data-action="repair">BENGKEL</button><button id="btnExit" data-action="exit" class="hidden">TURUN</button>
  <button id="btnBrake" data-k="space">REM</button>
 </div>
</div>
<div id="vehicleControls"><button class="vbtn" data-k="a">◀</button><button class="vbtn brake" data-k="space">REM</button><button class="vbtn" data-k="d">▶</button><button class="vbtn reverse" data-k="s">MUNDUR</button><button class="vbtn gas" data-k="gas">GAS 🚗</button></div>
<script>
(function(){
  const status=document.createElement('div');
  status.id='boot-status';
  status.style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101820;color:#fff;font:700 16px Arial;z-index:9999;padding:24px;text-align:center;';
  status.textContent='Memuat mesin 3D Cirebon...';
  document.body.appendChild(status);
  window.__threeReady=new Promise((resolve,reject)=>{
    if(window.THREE) return resolve(window.THREE);
    const urls=[
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js',
      'https://unpkg.com/three@0.180.0/build/three.min.js',
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js'
    ];
    let i=0;
    const load=()=>{
      if(window.THREE) return resolve(window.THREE);
      if(i>=urls.length) return reject(new Error('Three.js tidak dapat dimuat. Periksa koneksi internet lalu refresh.'));
      const s=document.createElement('script');
      s.src=urls[i++];
      s.async=false;
      s.onload=()=>window.THREE?resolve(window.THREE):load();
      s.onerror=load;
      document.head.appendChild(s);
    };
    load();
  });
})();
window.addEventListener('error',e=>{
  const t=document.querySelector('#toast');
  const b=document.querySelector('#boot-status');
  const msg=e.message||'error JavaScript';
  if(t){t.textContent='Game gagal memuat: '+msg;t.style.opacity=1;t.style.whiteSpace='normal';t.style.maxWidth='90vw';}
  if(b){b.textContent='Game gagal memuat: '+msg;b.style.color='#ff8080';}
});
</script>
<script>
(async()=>{
try{
const THREE=await window.__threeReady;
const boot=document.querySelector('#boot-status'); if(boot) boot.remove();

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x4f7890);
scene.fog=new THREE.Fog(0x4f7890,180,620);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
const cameraControls={
 target:new THREE.Vector3(0,0,0),distance:34,height:22,
 panX:0,panZ:0,dragging:false,lastX:0,lastY:0,pointers:new Map(),pinchStart:0,pinchMidX:0,pinchMidY:0
};
function clampCamera(){
 cameraControls.distance=Math.max(9,Math.min(105,cameraControls.distance));
 cameraControls.panX=Math.max(-120,Math.min(120,cameraControls.panX));
 cameraControls.panZ=Math.max(-120,Math.min(120,cameraControls.panZ));
 cameraControls.target.x=Math.max(-250,Math.min(250,cameraControls.target.x));
 cameraControls.target.z=Math.max(-250,Math.min(250,cameraControls.target.z));
 camera.position.set(cameraControls.target.x,cameraControls.height,cameraControls.target.z+cameraControls.distance);
 camera.lookAt(cameraControls.target.x,1.0,cameraControls.target.z);
}
function zoomCamera(amount){cameraControls.distance=Math.max(9,Math.min(105,cameraControls.distance+amount));clampCamera();}
function setCameraFromPlayer(player){
 if(!player)return;
 const follow=.16;
 const tx=THREE.MathUtils.clamp(player.position.x+cameraControls.panX,-250,250);
 const tz=THREE.MathUtils.clamp(player.position.z+cameraControls.panZ,-250,250);
 cameraControls.target.x=THREE.MathUtils.lerp(cameraControls.target.x,tx,follow);
 cameraControls.target.z=THREE.MathUtils.lerp(cameraControls.target.z,tz,follow);
 camera.position.set(cameraControls.target.x,cameraControls.height,cameraControls.target.z+cameraControls.distance);
 camera.lookAt(cameraControls.target.x,1.0,cameraControls.target.z);
}
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoomCamera(e.deltaY*.045)},{passive:false});
function pointerPair(){
 const a=[...cameraControls.pointers.values()];
 return a.length>=2?[a[0],a[1]]:null;
}
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 cameraControls.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 renderer.domElement.setPointerCapture?.(e.pointerId);
 const pair=pointerPair();
 if(pair){
   cameraControls.dragging=false;
   cameraControls.pinchStart=Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);
   cameraControls.pinchMidX=(pair[0].x+pair[1].x)/2;
   cameraControls.pinchMidY=(pair[0].y+pair[1].y)/2;
 }else{
   cameraControls.dragging=true;
   cameraControls.lastX=e.clientX;cameraControls.lastY=e.clientY;
 }
});
renderer.domElement.addEventListener('pointermove',e=>{
 const p=cameraControls.pointers.get(e.pointerId);
 if(p){p.x=e.clientX;p.y=e.clientY;}
 const pair=pointerPair();
 if(pair){
   e.preventDefault();
   const d=Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);
   if(cameraControls.pinchStart)zoomCamera((cameraControls.pinchStart-d)*.055);
   cameraControls.pinchStart=d;
   return;
 }
 if(!cameraControls.dragging)return;
 const dx=e.clientX-cameraControls.lastX,dy=e.clientY-cameraControls.lastY;
 cameraControls.lastX=e.clientX;cameraControls.lastY=e.clientY;
 const scale=.075*(cameraControls.distance/34);
 cameraControls.panX-=dx*scale;
 cameraControls.panZ+=dy*scale;
});
function endPointer(e){
 cameraControls.pointers.delete(e.pointerId);
 if(cameraControls.pointers.size<2)cameraControls.pinchStart=0;
 cameraControls.dragging=false;
}
renderer.domElement.addEventListener('pointerup',endPointer);
renderer.domElement.addEventListener('pointercancel',endPointer);
window.addEventListener('keydown',e=>{
 if(e.key==='+'||e.key==='=')zoomCamera(-2.5);
 if(e.key==='-'||e.key==='_')zoomCamera(2.5);
});
clampCamera();

renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const hemi=new THREE.HemisphereLight(0xffffff,0x28432d,1.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(80,120,40);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.near=1;sun.shadow.camera.far=360;sun.shadow.camera.left=-190;sun.shadow.camera.right=190;sun.shadow.camera.top=190;sun.shadow.camera.bottom=-190;scene.add(sun);
document.querySelector('#game').appendChild(renderer.domElement);
const moonLight=new THREE.DirectionalLight(0x9bbcff,0.0);moonLight.position.set(-70,90,-110);scene.add(moonLight);
const fillLight=new THREE.DirectionalLight(0xffd9b0,0.35);fillLight.position.set(-60,45,80);scene.add(fillLight);
const roadEdgeMat=new THREE.MeshStandardMaterial({color:0x9a9a9a,roughness:.95});
const windowMat=new THREE.MeshStandardMaterial({color:0x263c52,roughness:.28,metalness:.05});
const lampMat=new THREE.MeshStandardMaterial({color:0xffd36a,emissive:0xffa000,emissiveIntensity:0.0});
function addWindowGlow(x,y,z,sx,sz){const w=new THREE.Mesh(new THREE.PlaneGeometry(sx,sz),lampMat);w.position.set(x,y,z);w.rotation.y=Math.PI;scene.add(w);return w}
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const rnd=(a,b)=>a+Math.random()*(b-a);
const colliders=[];
function addCollider(x,z,w,d,pad=0){colliders.push({x,z,w:w+pad,d:d+pad})}
function blocked(pos,r=2){return colliders.some(b=>Math.abs(pos.x-b.x)<b.w/2+r&&Math.abs(pos.z-b.z)<b.d/2+r)}
function moveWithCollision(obj,dx,dz,r=2){const ox=obj.position.x,oz=obj.position.z,nx=ox+dx,nz=oz+dz;if(!blocked(new THREE.Vector3(nx,obj.position.y,nz),r)){obj.position.x=nx;obj.position.z=nz;return true}let moved=false;if(!blocked(new THREE.Vector3(nx,obj.position.y,oz),r)){obj.position.x=nx;moved=true}if(!blocked(new THREE.Vector3(obj.position.x,obj.position.y,nz),r)){obj.position.z=nz;moved=true}return moved}
function meshBox(parent,x,y,z,sx,sy,sz,c){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m}
function label(text,x,z){const c=document.createElement('canvas');c.width=512;c.height=80;const ctx=c.getContext('2d');ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,512,80);ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText(text,256,52);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(20,3.2,1);s.position.set(x,8,z);scene.add(s)}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(620,620),mat(0x416f45));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Cirebon-inspired grid district, not a copy of Google Maps.
const roadMat=mat(0x3d3d3d),edgeMat=mat(0xd9d9d9),centerMat=mat(0xf4f4f4);
function roadMarkH(z){
  for(let x=-177;x<177;x+=10) meshBox(null,x,.085,z,5.2,.035,.12,0xf4f4f4);
  meshBox(null,0,.09,z-5.05,354,.035,.12,0xffffff);meshBox(null,0,.09,z+5.05,354,.035,.12,0xffffff);
}
function roadMarkV(x){
  for(let z=-177;z<177;z+=10) meshBox(null,x,.085,z,.12,.035,5.2,0xf4f4f4);
  meshBox(null,x-5.05,.09,0,.12,.035,354,0xffffff);meshBox(null,x+5.05,.09,0,.12,.035,354,0xffffff);
}
for(let x=-160;x<=160;x+=40){const road=meshBox(null,x,.035,0,11,.07,360,0x3d3d3d);road.receiveShadow=true;roadMarkV(x)}
for(let z=-160;z<=160;z+=40){const road=meshBox(null,0,.035,z,360,.07,11,0x3d3d3d);road.receiveShadow=true;roadMarkH(z)}
// Strict city-block placement. Roads have an 11-unit width, so every building
// is kept at least 7 units from the road center and never overlaps the road surface.
for(let bx=-150;bx<=150;bx+=20)for(let bz=-150;bz<=150;bz+=20){
  if(Math.abs(bx%40)===0 || Math.abs(bz%40)===0) continue;
  const h=rnd(7,17),bw=rnd(6.5,8.2),bd=rnd(6.5,8.2);
  const roadClearX=5.8, roadClearZ=5.8;
  const cx=bx,cz=bz;
  if(Math.abs(cx%40)<roadClearX || Math.abs(cz%40)<roadClearZ) continue;
  // Blok fasilitas utama dicadangkan agar bangunan prosedural tidak menutup landmark atau badan jalan.
  const reserved=[[20,20],[-100,-100],[100,-100],[-100,100],[140,140],[-140,140]];
  if(reserved.some(([rx,rz])=>Math.abs(cx-rx)<10&&Math.abs(cz-rz)<10)) continue;
  const cc=[0xd6b08c,0xb7c9d9,0xd0d0c0,0xc59b79,0xa9c5a8][Math.floor(rnd(0,5))];
  const building=meshBox(null,cx,h/2,cz,bw,h,bd,cc);building.castShadow=true;building.receiveShadow=true;
  addCollider(cx,cz,bw,bd,.35);
  if(Math.random()<.22){const roof=meshBox(null,cx,h+.5,cz,bw*.55,.7,bd*.55,0x4e4e4e);roof.castShadow=true;roof.receiveShadow=true;}
  if(Math.random()<.72){
    const side=new THREE.Mesh(new THREE.BoxGeometry(Math.max(2.4,bw*.58),Math.min(1.8,h*.16),.035),windowMat);
    side.position.set(cx,h*.58,cz-bd/2-.02);side.castShadow=false;scene.add(side);
    const side2=side.clone();side2.position.z=cz+bd/2+.02;side2.rotation.y=Math.PI;scene.add(side2);
  }
}

// Landmarks and districts
meshBox(null,20,4,20,22,8,18,0xd3ad47);addCollider(20,20,22,18,2);meshBox(null,20,9,20,12,2,9,0xf1dfb7);label('BALAI KOTA',20,20);
meshBox(null,-100,4,-100,28,8,20,0xc98b46);addCollider(-100,-100,28,20,2);meshBox(null,-100,9,-100,18,2,12,0xeee0b0);label('KERATON',-100,-100);
meshBox(null,100,5,-100,28,10,20,0x8798aa);addCollider(100,-100,28,20,2);meshBox(null,100,11,-100,22,2,14,0x4b6680);label('AREA MALL',100,-100);
meshBox(null,-100,3,100,28,6,20,0x4b7652);addCollider(-100,100,28,20,2);label('ALUN-ALUN',-100,100);

// Gas station / workshop
function marker(x,z,color,text){const p=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.2,32),new THREE.MeshBasicMaterial({color}));p.position.set(x,.15,z);scene.add(p);label(text,x,z);return p}
const gas=marker(140,140,0x27d35f,'SPBU');
const shop=marker(-140,140,0x2ea8ff,'BENGKEL');
meshBox(null,140,2,140,20,4,14,0x2f7b4a);addCollider(140,140,20,14,1);
meshBox(null,-140,2,140,20,4,14,0x287bb8);addCollider(-140,140,20,14,1);

// Road shoulders: visual curb strips keep the street edge readable without blocking traffic.
for(let p=-160;p<=160;p+=40){meshBox(null,p,.11,-174,12,.12,2,0x777777);meshBox(null,p,.11,174,12,.12,2,0x777777);meshBox(null,-174,.11,p,2,.12,12,0x777777);meshBox(null,174,.11,p,2,.12,12,0x777777)}

const treeGroup=new THREE.Group();scene.add(treeGroup);
function addTree(x,z,scale=1){const g=new THREE.Group();const trunk=meshBox(g,0,1.6,0,.65,3.2,.65,0x76502f);trunk.castShadow=true;const crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,10,8),new THREE.MeshStandardMaterial({color:0x2f7d3c,roughness:1}));crown.position.y=4.1;crown.scale.set(scale,1.05*scale,scale);crown.castShadow=true;crown.receiveShadow=true;g.position.set(x,0,z);treeGroup.add(g)}
for(let x=-170;x<=170;x+=20)for(let z=-170;z<=170;z+=20){if(Math.abs(x%40)>7&&Math.abs(z%40)>7&&Math.random()<.12)addTree(x+rnd(-3,3),z+rnd(-3,3),rnd(.75,1.15))}
const target=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.18,32),new THREE.MeshStandardMaterial({color:0xffd21a,emissive:0x6b4d00,emissiveIntensity:.45}));
target.position.set(120,.18,120);scene.add(target);


// Audio vehicle sementara dimatikan. Visual/gameplay tetap aktif.
let audioReady=false,audioInitialized=false,audioMaster=0,audioRainGain=null,audioAmbGain=null,audioLastImpact=0;
function ensureAudio(){audioReady=false}
function soundBurst(){/* efek kendaraan dimatikan sementara */}
function updateAudio(){}
function updateRealAudio(){}
function beep(){}

function makeHuman(skin=0xc98f72,shirt=0x2468d8,pants=0x20242a,shoe=0x171717,hair=0x201810){
 const g=new THREE.Group();g.userData.human=true;
 // Skala dunia: tinggi dasar manusia sekitar 1.9 m, agar proporsional dengan mobil, jalan, dan bangunan.
 g.scale.setScalar(.34);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.45,5,10),mat(shirt));torso.position.y=2.55;torso.scale.z=.62;torso.castShadow=true;g.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.58,14,12),mat(skin));head.position.y=4.15;head.castShadow=true;g.add(head);
 const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.61,14,8,0,Math.PI*2,0,Math.PI*.48),mat(hair));hairCap.position.y=4.35;hairCap.castShadow=true;g.add(hairCap);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.28,10),mat(skin));neck.position.y=3.55;g.add(neck);
 const limbMat=mat(shirt),pantsMat=mat(pants),shoeMat=mat(shoe);
 const armL=new THREE.Group(),armR=new THREE.Group(),legL=new THREE.Group(),legR=new THREE.Group();
 const armGeo=new THREE.CapsuleGeometry(.22,.95,5,8),legGeo=new THREE.CapsuleGeometry(.25,1.05,5,8);
 const makeLimb=(parent,geo,m, x,y)=>{const q=new THREE.Mesh(geo,m);q.position.set(x,y,0);q.castShadow=true;parent.add(q);return q};
 armL.position.set(-.82,2.95,0);armR.position.set(.82,2.95,0);legL.position.set(-.34,1.35,0);legR.position.set(.34,1.35,0);
 makeLimb(armL,armGeo,limbMat,0,-.52);makeLimb(armR,armGeo,limbMat,0,-.52);
 makeLimb(legL,legGeo,pantsMat,0,-.58);makeLimb(legR,legGeo,pantsMat,0,-.58);
 const footL=new THREE.Mesh(new THREE.BoxGeometry(.42,.22,.72),shoeMat);footL.position.set(0,-1.25,-.14);footL.castShadow=true;legL.add(footL);
 const footR=footL.clone();legR.add(footR);
 g.add(armL,armR,legL,legR);g.userData.parts={armL,armR,legL,legR};return g;
}
function animateHuman(g,t,walking){
 const p=g.userData.parts;if(!p)return;

   n.userData.activityTimer-=dt;
   if(n.userData.workState==='inside'||n.userData.workState==='driving'||n.userData.workState==='rest') n.userData.workTimer-=dt;
   const side=n.userData.side||((i%2===0)?-7.2:7.2);
   const role=n.userData.role||'warga';
   const setTarget=(x,z)=>n.userData.target.set(x,0,z);

   // Perilaku kerja: setiap profesi punya tujuan, kendaraan, dan siklus kerja yang bisa dilihat pemain.
   if(role==='kantor'){
     const doorX=20+((i%3)-1)*3.5,doorZ=31;
     if(n.userData.workState==='commute'){
       const dx=doorX-n.position.x,dz=doorZ-n.position.z,d=Math.hypot(dx,dz);
       if(d>1.5){const step=Math.min(d,.06*dt*60);n.position.x+=dx/d*step;n.position.z+=dz/d*step;n.rotation.y=Math.atan2(dx,-dz);animateHuman(n,now+n.userData.walkPhase,true)}
       else{n.userData.workState='inside';n.userData.workTimer=5+Math.random()*7;n.visible=false}
     }else if(n.userData.workState==='inside'){
       if(n.userData.workTimer<=0){n.visible=true;n.userData.workState='leaving';setTarget(n.position.x,doorZ+5)}
     }else if(n.userData.workState==='leaving'){
       const dx=n.userData.target.x-n.position.x,dz=n.userData.target.z-n.position.z,d=Math.hypot(dx,dz);
       if(d>1.2){const step=Math.min(d,.06*dt*60);n.position.x+=dx/d*step;n.position.z+=dz/d*step;n.rotation.y=Math.atan2(dx,-dz);animateHuman(n,now+n.userData.walkPhase,true)}
       else{n.userData.workState='commute';n.userData.workTimer=0;n.position.set(npcRoad[(i+2)%npcRoad.length]+side,0,npcRoad[(i*3+2)%npcRoad.length]);}
     }
     return;
   }

   if(role==='taksi' || role==='truk'){
     const pool=role==='taksi'?taxiWorkVehicles:truckWorkVehicles;
     const v=pool[i%pool.length];
     if(n.userData.workState==='commute'){
       const doorX=v.position.x+((i%2)?2.8:-2.8),doorZ=v.position.z+((i%2)?0:2.8);
       const dx=doorX-n.position.x,dz=doorZ-n.position.z,d=Math.hypot(dx,dz);
       if(d>1.6){const step=Math.min(d,.07*dt*60);n.position.x+=dx/d*step;n.position.z+=dz/d*step;n.rotation.y=Math.atan2(dx,-dz);animateHuman(n,now+n.userData.walkPhase,true)}
       else{n.userData.workState='driving';n.userData.workTimer=role==='taksi'?8+Math.random()*6:10+Math.random()*8;n.visible=false;v.userData.driver=n;v.userData.workStartX=v.position.x;v.userData.workStartZ=v.position.z;v.userData.workDir=i%2?1:-1}
     }else if(n.userData.workState==='driving'){
       const dir=v.userData.workDir||1;
       v.position.z+=dir*(role==='taksi'?12:9)*dt;
       if(v.position.z>168||v.position.z<-168){v.userData.workDir*=-1}
       v.rotation.y=dir>0?0:Math.PI;
       if(n.userData.workTimer<=0){
         n.visible=true;n.userData.workState='rest';n.position.set(v.position.x+(i%2?2.8:-2.8),0,v.position.z);n.rotation.y=v.rotation.y;
         v.userData.driver=null;
       }
     }else if(n.userData.workState==='rest'){
       animateHuman(n,now+n.userData.walkPhase,false);
       if(n.userData.workTimer<=-3){n.userData.workState='commute';n.userData.workTimer=0}
     }
     return;
   }

   if(!n.visible)return;
   if(role==='warga'){updateSafeNpc(n,i,dt,now);return;}

   // Interaksi sosial nyata: dua NPC yang berdekatan berhenti, saling menghadap,
   // melambaikan tangan/berbicara, lalu kembali ke rute trotoar.
   if(n.userData.activity==='talk'){
     let p=n.userData.talkPartner;
     if(!p||!p.visible||p.position.distanceTo(n.position)>3.2){
       let best=null,bd=3.2;
       for(let j=0;j<npcs.length;j++){const q=npcs[j];if(q===n||!q.visible||q.userData.role!=='warga')continue;const d=n.position.distanceTo(q.position);if(d<bd){bd=d;best=q}}
       p=best;n.userData.talkPartner=p;
     }
     if(p){
       const mx=(n.position.x+p.position.x)/2,mz=(n.position.z+p.position.z)/2;
       n.position.x+=(mx-n.position.x)*dt*.8;n.position.z+=(mz-n.position.z)*dt*.8;
       n.rotation.y=Math.atan2(p.position.x-n.position.x,-(p.position.z-n.position.z));
       p.rotation.y=Math.atan2(n.position.x-p.position.x,-(n.position.z-p.position.z));
       animateHuman(n,now+n.userData.walkPhase,false);
       if(p.userData.parts){p.userData.parts.armR.rotation.x=Math.sin(now*5)*.7;animateHuman(p,now+p.userData.walkPhase,false)}
     }else n.userData.activity='walk';
     if(n.userData.activityTimer<=0){n.userData.activity='walk';n.userData.talkPartner=null}
   }else if(n.userData.activity==='phone'){
     n.rotation.y=Math.sin(now*.35+n.userData.walkPhase)*.12;animateHuman(n,now+n.userData.walkPhase,false);
     if(n.userData.phone){n.userData.phone.rotation.y+=dt*1.5;n.userData.parts.armR.rotation.x=-.9}
     if(n.userData.activityTimer<=0)n.userData.activity='walk';
   }else if(n.userData.activity==='wait'){
     n.rotation.y=Math.sin(now*.25+n.userData.walkPhase)*.18;animateHuman(n,now+n.userData.walkPhase,false);
     if(n.userData.activityTimer<=0)n.userData.activity='walk';
   }else{
     const t=n.userData.target,dx=t.x-n.position.x,dz=t.z-n.position.z,d=Math.hypot(dx,dz);
     if(d<1.1){
       if(n.userData.routePhase===0){
         n.userData.routePhase=1;setTarget(n.userData.routeRoad+side,n.position.z);
       }else{
         n.userData.routePhase=0;
         const nextIndex=(n.userData.pathIndex+1+npcs.length)%npcRoad.length;
         n.userData.pathIndex=nextIndex;n.userData.routeRoad=npcRoad[nextIndex%npcRoad.length];
         setTarget(n.position.x,npcRoad[(nextIndex+2)%npcRoad.length]);
         if(Math.random()<.18){
           const act=['talk','phone','wait'][Math.floor(Math.random()*3)];
           n.userData.activity=act;n.userData.activityTimer=2+Math.random()*5;
         }
       }
     }else{
       const step=Math.min(d,.065*dt*60);
       n.position.x+=dx/d*step;n.position.z+=dz/d*step;n.rotation.y=Math.atan2(dx,-dz);
       animateHuman(n,now+n.userData.walkPhase,true);
     }
   }
 }); handleWanted(dt,obj);
 if(obj.position.distanceTo(target.position)<9)completeMission();
 cameraControls.height=THREE.MathUtils.lerp(cameraControls.height,inCar?9:22,.08);
 setCameraFromPlayer(obj);
 clampCamera();
 const area=obj.position.distanceTo(gas.position)<30?'SPBU':obj.position.distanceTo(shop.position)<30?'Bengkel':obj.position.distanceTo(new THREE.Vector3(-100,0,-100))<35?'Keraton':obj.position.distanceTo(new THREE.Vector3(100,0,-100))<35?'Area Mall':obj.position.distanceTo(new THREE.Vector3(-100,0,100))<35?'Alun-Alun':'Kota';
 document.querySelector('#area').textContent=area;
 document.querySelector('#cash').textContent=Math.floor(cash).toLocaleString('id-ID');document.querySelector('#fuel').textContent=Math.round(fuel);document.querySelector('#wanted').textContent=wanted;document.querySelector('#health').textContent=Math.round(health);
 updateMap(obj);updateWorld(dt);updateAudio(dt);updateRealAudio();syncVehicleUI();updateContextControls();document.querySelector('#weather').textContent=weather==='Hujan'?'🌧️ Hujan':weather==='Mendung'?'☁️ Mendung':'☀️ Cerah';
}
function updateMap(obj){
 const c=document.querySelector('#map'),ctx=c.getContext('2d'),w=c.width,h=c.height,s=280/128;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#1e3a27';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#555';ctx.lineWidth=5;
 for(let p=-140;p<=140;p+=40){const q=64+p/s;ctx.beginPath();ctx.moveTo(q,0);ctx.lineTo(q,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,q);ctx.lineTo(w,q);ctx.stroke()}
 const dot=(x,z,color,r=3)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(64+x/s,64+z/s,r,0,Math.PI*2);ctx.fill()};
 dot(target.position.x,target.position.z,'#ffd21a',4);dot(gas.position.x,gas.position.z,'#20e060',3);dot(shop.position.x,shop.position.z,'#2ea8ff',3);
 police.forEach(p=>{if(p.position.distanceTo(obj.position)<130)dot(p.position.x,p.position.z,'#ff4545',2)});
 dot(obj.position.x,obj.position.z,'#37a8ff',4);
}
function keyDown(e){ensureAudio();
 const k=e.key.toLowerCase();if(e.key===' ')keys.add('space');else if(e.key==='shift')keys.add('shift');else {keys.add(k);if(k==='arrowup')keys.add('w');if(k==='arrowdown')keys.add('s');if(k==='arrowleft')keys.add('a');if(k==='arrowright')keys.add('d');}
 if(k==='e')enterExit();if(k==='r')service();if(k==='f5')saveGame();if(k==='f9')loadGame();
}
addEventListener('keydown',keyDown);addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(e.key==='ArrowUp')keys.delete('w');if(e.key==='ArrowDown')keys.delete('s');if(e.key==='ArrowLeft')keys.delete('a');if(e.key==='ArrowRight')keys.delete('d');if(e.key===' ')keys.delete('space');if(e.key==='shift')keys.delete('shift')});
document.querySelectorAll('button[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();ensureAudio();keys.add(k);if(k==='gas')keys.add('w')};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{keys.delete(k);if(k==='gas')keys.delete('w')}});
document.querySelectorAll('button[data-action]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();const a=b.dataset.action;if(a==='enter')enterExit();if(a==='steal')stealNearestCar();if(a==='repair')service();if(a==='exit')enterExit()}});
setMission();buildWeatherFX();syncVehicleUI();ensureAudio();
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

}catch(err){
  const boot=document.querySelector("#boot-status");
  if(boot){boot.textContent="Game gagal memuat: "+(err.message||err);boot.style.color="#ff8080";}
  console.error(err);
}
})();
</script>
