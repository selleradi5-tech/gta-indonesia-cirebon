<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif;touch-action:none}

#minimap{position:fixed;right:10px;top:62px;width:104px;height:104px;background:#122018e8;border:2px solid #fff8;border-radius:15px;overflow:hidden;z-index:5}
#map{width:100%;height:100%}#vehicleHud{position:fixed;left:10px;bottom:170px;background:#000c;border:1px solid #fff3;border-radius:14px;padding:8px 12px;min-width:135px;text-align:center;z-index:6;pointer-events:none;display:none;font-weight:800;text-shadow:0 2px 3px #000}#speed{font-size:21px}#vehicleControls{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:none;grid-template-columns:repeat(3,62px);gap:5px;z-index:7;pointer-events:none}.vbtn{pointer-events:auto;height:50px!important;border-radius:15px!important;background:#0b0b0dcc!important}.gas{grid-column:2/4!important;background:#176b2acc!important;font-size:12px!important}.brake{background:#7a2022cc!important}.reverse{background:#725515cc!important}@media(max-width:430px){#vehicleControls{grid-template-columns:repeat(3,60px)}.vbtn{height:52px!important}}#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#000d;border:1px solid #fff3;padding:9px 14px;border-radius:13px;opacity:0;transition:.2s;pointer-events:none;z-index:10;white-space:nowrap}
#controls{position:fixed;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;z-index:6;pointer-events:none}.actions button{height:42px;font-size:11px;padding:0 8px;border-radius:12px}.pad button{height:42px;font-size:13px}
.pad,.actions{display:grid;gap:7px;pointer-events:auto}.pad{grid-template-columns:repeat(3,54px)}.actions{grid-template-columns:repeat(3,56px)}
button{height:52px;border:1px solid #fff5;border-radius:14px;background:#111c;color:#fff;font-size:15px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;backdrop-filter:blur(5px)}
button:active{background:#fff3}.spacer{visibility:hidden}.hidden{display:none!important}
@media(max-width:430px){#minimap{width:108px;height:108px}.actions{grid-template-columns:repeat(3,58px)}button{height:48px;font-size:13px}.pad{grid-template-columns:repeat(3,50px)}#mission{top:72px;font-size:12px;min-width:220px}.box{font-size:12px}}
</style>

 </div>

<script>
(function(){
  const status=document.createElement('div');
  status.id='boot-status';
  status.style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101820;color:#fff;font:700 16px Arial;z-index:9999;padding:24px;text-align:center;';
  status.textContent='Memuat mesin 3D Cirebon...';
  document.body.appendChild(status);
  window.__threeReady=new Promise((resolve,reject)=>{
    if(window.THREE) return resolve(window.THREE);
    const urls=[
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js',
      'https://unpkg.com/three@0.180.0/build/three.min.js',
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js'
    ];
    let i=0;
    const load=()=>{
      if(window.THREE) return resolve(window.THREE);
      if(i>=urls.length) return reject(new Error('Three.js tidak dapat dimuat. Periksa koneksi internet lalu refresh.'));
      const s=document.createElement('script');
      s.src=urls[i++];
      s.async=false;
      s.onload=()=>window.THREE?resolve(window.THREE):load();
      s.onerror=load;
      document.head.appendChild(s);
    };
    load();
  });
})();
window.addEventListener('error',e=>{
  const t=document.querySelector('#toast');
  const b=document.querySelector('#boot-status');
  const msg=e.message||'error JavaScript';
  if(t){t.textContent='Game gagal memuat: '+msg;t.style.opacity=1;t.style.whiteSpace='normal';t.style.maxWidth='90vw';}
  if(b){b.textContent='Game gagal memuat: '+msg;b.style.color='#ff8080';}
});
</script>
<script>
(async()=>{
try{
const THREE=await window.__threeReady;
const boot=document.querySelector('#boot-status'); if(boot) boot.remove();

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x4f7890);
scene.fog=new THREE.Fog(0x4f7890,180,620);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.near=1;sun.shadow.camera.far=360;sun.shadow.camera.left=-190;sun.shadow.camera.right=190;sun.shadow.camera.top=190;sun.shadow.camera.bottom=-190;document.querySelector('#game').appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x28432d,1.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(80,120,40);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const rnd=(a,b)=>a+Math.random()*(b-a);
const colliders=[];
function addCollider(x,z,w,d,pad=0){colliders.push({x,z,w:w+pad,d:d+pad})}
function blocked(pos,r=2){return colliders.some(b=>Math.abs(pos.x-b.x)<b.w/2+r&&Math.abs(pos.z-b.z)<b.d/2+r)}
function moveWithCollision(obj,dx,dz,r=2){const ox=obj.position.x,oz=obj.position.z,nx=ox+dx,nz=oz+dz;if(!blocked(new THREE.Vector3(nx,obj.position.y,nz),r)){obj.position.x=nx;obj.position.z=nz;return true}let moved=false;if(!blocked(new THREE.Vector3(nx,obj.position.y,oz),r)){obj.position.x=nx;moved=true}if(!blocked(new THREE.Vector3(obj.position.x,obj.position.y,nz),r)){obj.position.z=nz;moved=true}return moved}
function meshBox(parent,x,y,z,sx,sy,sz,c){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m}
function label(text,x,z){const c=document.createElement('canvas');c.width=512;c.height=80;const ctx=c.getContext('2d');ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,512,80);ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.textAlign='center';ctx.fillText(text,256,52);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(20,3.2,1);s.position.set(x,8,z);scene.add(s)}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(620,620),mat(0x416f45));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Cirebon-inspired grid district, not a copy of Google Maps.
for(let x=-160;x<=160;x+=40){const road=meshBox(null,x,.035,0,11,.07,360,0x3d3d3d);road.receiveShadow=true;const line=meshBox(null,x,.075,0,.25,.09,360,0xf0d35a);line.receiveShadow=true}
for(let z=-160;z<=160;z+=40){const road=meshBox(null,0,.035,z,360,.07,11,0x3d3d3d);road.receiveShadow=true;const line=meshBox(null,0,.075,z,360,.09,.25,0xf0d35a);line.receiveShadow=true;meshBox(null,0,.085,z-2.6,360,.05,.10,0xffffff);meshBox(null,0,.085,z+2.6,360,.05,.10,0xffffff)}
// Strict city-block placement. Roads have an 11-unit width, so every building
// is kept at least 7 units from the road center and never overlaps the road surface.
for(let bx=-150;bx<=150;bx+=20)for(let bz=-150;bz<=150;bz+=20){
  if(Math.abs(bx%40)===0 || Math.abs(bz%40)===0) continue;
  const h=rnd(7,17),bw=rnd(6.5,8.2),bd=rnd(6.5,8.2);
  const roadClearX=5.8, roadClearZ=5.8;
  const cx=bx,cz=bz;
  if(Math.abs(cx%40)<roadClearX || Math.abs(cz%40)<roadClearZ) continue;
  const cc=[0xd6b08c,0xb7c9d9,0xd0d0c0,0xc59b79,0xa9c5a8][Math.floor(rnd(0,5))];
  const building=meshBox(null,cx,h/2,cz,bw,h,bd,cc);building.castShadow=true;building.receiveShadow=true;
  addCollider(cx,cz,bw,bd,.35);
  if(Math.random()<.22){const roof=meshBox(null,cx,h+.5,cz,bw*.55,.7,bd*.55,0x4e4e4e);roof.castShadow=true;roof.receiveShadow=true;}
}

// Landmarks and districts
meshBox(null,10,4,10,24,8,19,0xd3ad47);addCollider(10,10,24,19,2);meshBox(null,10,9,10,13,2,10,0xf1dfb7);label('BALAI KOTA',10,10);
meshBox(null,-90,4,-90,30,8,24,0xc98b46);addCollider(-90,-90,30,24,2);meshBox(null,-90,9,-90,20,2,14,0xeee0b0);label('KERATON',-90,-90);
meshBox(null,90,5,-90,34,10,25,0x8798aa);addCollider(90,-90,34,25,2);meshBox(null,90,11,-90,27,2,18,0x4b6680);label('AREA MALL',90,-90);
meshBox(null,-90,3,90,28,6,22,0x4b7652);addCollider(-90,90,28,22,2);label('ALUN-ALUN',-90,90);

// Gas station / workshop
function marker(x,z,color,text){const p=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.2,32),new THREE.MeshBasicMaterial({color}));p.position.set(x,.15,z);scene.add(p);label(text,x,z);return p}
const gas=marker(100,120,0x27d35f,'SPBU');
const shop=marker(-100,120,0x2ea8ff,'BENGKEL');
meshBox(null,100,2,120,20,4,14,0x2f7b4a);addCollider(100,120,20,14,1);
meshBox(null,-100,2,120,20,4,14,0x287bb8);addCollider(-100,120,20,14,1);

// Road shoulders: visual curb strips keep the street edge readable without blocking traffic.
for(let p=-160;p<=160;p+=40){meshBox(null,p,.11,-174,12,.12,2,0x777777);meshBox(null,p,.11,174,12,.12,2,0x777777);meshBox(null,-174,.11,p,2,.12,12,0x777777);meshBox(null,174,.11,p,2,.12,12,0x777777)}

const treeGroup=new THREE.Group();scene.add(treeGroup);
function addTree(x,z,scale=1){const g=new THREE.Group();const trunk=meshBox(g,0,1.6,0,.65,3.2,.65,0x76502f);trunk.castShadow=true;const crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,10,8),new THREE.MeshStandardMaterial({color:0x2f7d3c,roughness:1}));crown.position.y=4.1;crown.scale.set(scale,1.05*scale,scale);crown.castShadow=true;crown.receiveShadow=true;g.position.set(x,0,z);treeGroup.add(g)}
for(let x=-170;x<=170;x+=20)for(let z=-170;z<=170;z+=20){if(Math.abs(x%40)>7&&Math.abs(z%40)>7&&Math.random()<.12)addTree(x+rnd(-3,3),z+rnd(-3,3),rnd(.75,1.15))}
const target=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.18,32),new THREE.MeshStandardMaterial({color:0xffd21a,emissive:0x6b4d00,emissiveIntensity:.45}));
target.position.set(120,.18,120);scene.add(target);


// ===== REALISTIC PROCEDURAL AUDIO SYSTEM =====
const audioListener=new THREE.AudioListener();camera.add(audioListener);
const REAL_AUDIO={engine:'https://upload.wikimedia.org/wikipedia/commons/b/b1/5_cylinder_engine_sound.ogg',siren:'https://upload.wikimedia.org/wikipedia/commons/b/b2/Whelen.ogg'};
const engineAudio=new Audio(REAL_AUDIO.engine);engineAudio.loop=true;engineAudio.preload='auto';engineAudio.volume=.12;
const sirenAudio=new Audio(REAL_AUDIO.siren);sirenAudio.loop=true;sirenAudio.preload='auto';sirenAudio.volume=.07;
let realAudioReady=false,engineGraph=null,sirenGraph=null;
function connectSoftAudio(el,kind){try{const ctx=audioListener.context,src=ctx.createMediaElementSource(el),gain=ctx.createGain(),filter=ctx.createBiquadFilter(),comp=ctx.createDynamicsCompressor();filter.type='lowpass';filter.frequency.value=kind==='engine'?1900:2600;filter.Q.value=.35;gain.gain.value=kind==='engine' ? .65 : .45;comp.threshold.value=-24;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.02;comp.release.value=.25;src.connect(filter).connect(gain).connect(comp).connect(ctx.destination);return{gain,filter,comp}}catch(e){return null}}
function startRealAudio(){try{const ctx=audioListener.context;if(ctx.state==='suspended')ctx.resume();if(!engineGraph)engineGraph=connectSoftAudio(engineAudio,'engine');if(!sirenGraph)sirenGraph=connectSoftAudio(sirenAudio,'siren');engineAudio.play().then(()=>{engineAudio.pause();engineAudio.currentTime=0;realAudioReady=true}).catch(()=>{})}catch(e){}}
function updateRealAudio(){if(!realAudioReady)return;const t=audioListener.context.currentTime;const inGain=inCar?Math.min(.10,.035+Math.abs(speed)/1200):0;engineAudio.volume=.1;if(engineGraph)engineGraph.gain.gain.setTargetAtTime(inGain,t,.12);if(inCar){engineAudio.playbackRate=Math.max(.86,Math.min(1.22,.9+Math.abs(speed)/220));if(engineAudio.paused)engineAudio.play().catch(()=>{})}else engineAudio.pause();if(wanted>0){if(sirenAudio.paused)sirenAudio.play().catch(()=>{});if(sirenGraph)sirenGraph.gain.gain.setTargetAtTime(.055,t,.18)}else{if(sirenGraph)sirenGraph.gain.gain.setTargetAtTime(0,t,.25);if(!sirenAudio.paused)sirenAudio.pause()}}
let audioReady=false,audioInitialized=false,audioMaster=.28,audioEngineNodes=[],audioRainGain=null,audioAmbGain=null,audioSirenNodes=[],audioLastImpact=0;
function ensureAudio(){
 startRealAudio();
 try{
  const ctx=audioListener.context;if(ctx.state==='suspended')ctx.resume();if(audioInitialized)return;
  audioInitialized=true;audioReady=true;audioListener.setMasterVolume(audioMaster);
  // Soft ambience and effects; recorded engine is the primary vehicle sound.
  const eg=ctx.createGain();eg.gain.value=0;eg.connect(ctx.destination);
  const o1=ctx.createOscillator(),o2=ctx.createOscillator(),og=ctx.createGain();
  o1.type='sawtooth';o2.type='triangle';o1.frequency.value=52;o2.frequency.value=104;og.gain.value=.34;
  o1.connect(og);o2.connect(og);og.connect(eg);o1.start();o2.start();
  const n=ctx.createBufferSource(),nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*.12;
  n.buffer=nb;n.loop=true;const nf=ctx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=700;n.connect(nf);nf.connect(eg);n.start();
  audioEngineNodes=[o1,o2,og,eg,nf,n];
  const rg=ctx.createGain();rg.gain.value=0;rg.connect(ctx.destination);audioRainGain=rg;
  const rn=ctx.createBufferSource(),rb=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),rd=rb.getChannelData(0);
  for(let i=0;i<rd.length;i++)rd[i]=(Math.random()*2-1)*.055;rn.buffer=rb;rn.loop=true;
  const rf=ctx.createBiquadFilter();rf.type='highpass';rf.frequency.value=900;rn.connect(rf);rf.connect(rg);rn.start();
  const ag=ctx.createGain();ag.gain.value=.018;ag.connect(ctx.destination);audioAmbGain=ag;
  const ao=ctx.createOscillator();ao.type='sine';ao.frequency.value=68;ao.connect(ag);ao.start();
  beep(760,.07,.025);
 }catch(e){}
}
function soundBurst(type='click',vol=.05){
 if(!audioReady)return;try{
  const ctx=audioListener.context,o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
  o.type=type==='horn'?'triangle':'sine';
  const base={click:420,unlock:300,impact:70,boost:140,brake:95,horn:220}[type]||360;
  o.frequency.setValueAtTime(base,ctx.currentTime);
  if(type==='impact')o.frequency.exponentialRampToValueAtTime(42,ctx.currentTime+.18);
  if(type==='boost')o.frequency.exponentialRampToValueAtTime(520,ctx.currentTime+.22);
  f.type='lowpass';f.frequency.value=type==='impact'?420:1200;
  g.gain.setValueAtTime(vol*.45,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+((type==='impact' ? .2 : .1)));
  o.connect(f);f.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+((type==='impact' ? .22 : .11)));
 }catch(e){}
}
function updateAudio(dt){
 if(!audioReady)return;const ctx=audioListener.context,eg=audioEngineNodes[3],o1=audioEngineNodes[0],o2=audioEngineNodes[1];
 if(eg){
  const rpm=inCar ? (48+Math.abs(speed)*3.2+(pressed('w') ? 22 : 0)) : 0;
  eg.gain.linearRampToValueAtTime((inCar ? .025 : 0),ctx.currentTime+.08);
  o1.frequency.setTargetAtTime(rpm,ctx.currentTime,.055);o2.frequency.setTargetAtTime(rpm*2.02,ctx.currentTime,.055);
 }
 if(audioRainGain)audioRainGain.gain.linearRampToValueAtTime(weather==='Hujan' ? .06 : weather==='Mendung' ? .012 : 0,ctx.currentTime+.35);
 if(audioAmbGain)audioAmbGain.gain.linearRampToValueAtTime((inCar ? .012 : .022),ctx.currentTime+.3);
 const wantedLevel=Math.min(1,wanted/5);
 if(wantedLevel>.01&&audioSirenNodes.length===0)startSiren();
 if(wantedLevel<=0&&audioSirenNodes.length)stopSiren();
 
}
function startSiren(){}
function stopSiren(){audioSirenNodes=[]}
function beep(freq=440,dur=.07,vol=.04){soundBurst('click',vol)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(1,2,6,10),mat(0x2468d8));body.position.y=2;player.add(body);player.position.set(40,0,20);scene.add(player);

function makeCar(x,z,color=0xc72c2c,police=false){
 const g=new THREE.Group();meshBox(g,0,1,0,3.8,1.35,6,color);
 meshBox(g,0,1.7,-.3,2.8,.7,2.6,0x202832);
 const wheelMat=mat(0x111111);
 for(const sx of[-1.7,1.7])for(const sz of[-2,2]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.45,16),wheelMat);w.rotation.z=Math.PI/2;w.position.set(sx,.62,sz);g.add(w)}
 if(police){meshBox(g,0,2.15,0,.8,.22,1.2,0xeeeeee)}
 g.position.set(x,0,z);scene.add(g);return g;
}
let car=makeCar(40,20,0x1d7c45),inCar=false;
const traffic=[];const roadXs=[-160,-120,-80,-40,0,40,80,120,160];for(let i=0;i<20;i++){const roadX=roadXs[i%roadXs.length];const lane=(i%2===0?-2.5:2.5);const c=makeCar(roadX+lane,-150+(i%5)*60,[0xc72c2c,0xeeeeee,0x2457a6,0xd7b23f,0x222222][i%5]);c.rotation.y=i%2?Math.PI:0;c.userData.speed=22+(i%5)*3;c.userData.stolen=false;c.userData.laneOffset=lane;traffic.push(c)}
const police=[];for(let i=0;i<4;i++)police.push(makeCar(-120+i*80,120,0xf2f2f2,true));
const npcs=[];const npcRoad=[-160,-120,-80,-40,0,40,80,120,160];for(let i=0;i<24;i++){const n=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.9,5,8),mat([0xe0a32f,0x8b5cf6,0x38a169,0xd97706][i%4]));n.position.set(npcRoad[i%npcRoad.length],1,npcRoad[(i*3)%npcRoad.length]);n.userData.target=new THREE.Vector3(npcRoad[(i*5+2)%npcRoad.length],1,npcRoad[(i*7+1)%npcRoad.length]);scene.add(n);npcs.push(n)}

let cash=150000,wanted=0,speed=0,fuel=100,health=100,mission=1,gameMinutes=720,carHealth=100,engineOn=false,weather='Cerah',weatherTimer=0;
const weatherStates=['Cerah','Mendung','Hujan'];
let rainDrops=[];
function buildWeatherFX(){rainDrops.forEach(r=>scene.remove(r));rainDrops=[];if(weather!=='Hujan')return;const g=new THREE.BufferGeometry();const pts=[];for(let i=0;i<420;i++)pts.push(rnd(-180,180),rnd(2,85),rnd(-180,180));g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const m=new THREE.PointsMaterial({color:0x9fd8ff,size:.32,transparent:true,opacity:.58,depthWrite:false});const rain=new THREE.Points(g,m);rain.userData.isRain=true;scene.add(rain);rainDrops.push(rain)}
function updateRain(dt,obj){if(weather!=='Hujan'||!rainDrops[0])return;const rain=rainDrops[0],a=rain.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-42*dt;let x=a.getX(i),z=a.getZ(i);if(y<1){y=rnd(45,85);x=obj.position.x+rnd(-180,180);z=obj.position.z+rnd(-180,180)}a.setXYZ(i,x,y,z)}a.needsUpdate=true}
function setWeather(next){weather=next;document.querySelector('#weather').textContent=weather==='Hujan'?'🌧️ Hujan':weather==='Mendung'?'☁️ Mendung':'☀️ Cerah';buildWeatherFX();if(weather==='Hujan')toast('🌧️ Hujan turun di Cirebon');}
function cycleWeather(){setWeather(weatherStates[(weatherStates.indexOf(weather)+1)%weatherStates.length]);beep(520,.12,.045)}
let missionReward=50000;const keys=new Set();const pressed=k=>keys.has(k);
let lastToast='',toastTimer=0;

function toast(t){ensureAudio();beep(620,.055,.035);const el=document.querySelector('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1900)}
function nearby(pos,obj,dist){return pos.distanceTo(obj.position)<dist}
function nearestTraffic(){
  let best=null,bd=7;
  traffic.forEach(v=>{const d=v.position.distanceTo(player.position);if(d<bd){bd=d;best=v}});
  return best;
}
function updateContextControls(){
 const nearCar=!inCar&&nearby(player.position,car,9);
 const nearTraffic=!inCar&&!!nearestTraffic();
 const nearService=inCar&&(car.position.distanceTo(shop.position)<20||car.position.distanceTo(gas.position)<20);
 const set=(id,on)=>{const e=document.querySelector(id);if(e)e.classList.toggle('hidden',!on)};
 set('#btnEnter',nearCar);set('#btnSteal',nearTraffic);set('#btnNitro',inCar&&fuel>2);set('#btnBrake',inCar);set('#btnRepair',nearService);
}
function syncVehicleUI(){
  const hud=document.querySelector('#vehicleHud');
  const controls=document.querySelector('#vehicleControls');
  if(!hud||!controls)return;
  hud.style.display=inCar?'block':'none';
  controls.style.display=inCar?'grid':'none';
  document.querySelector('#vehicleName').textContent=car&&car.userData.stolen?'Kendaraan Curian':'Cirebon Car';
  document.querySelector('#speed').textContent=Math.round(Math.abs(speed));
  document.querySelector('#gear').textContent=speed>0.03?'D':speed<-.03?'R':'N';
  document.querySelector('#carHealth').textContent=Math.round(carHealth);
}
function stealNearestCar(){
  if(inCar)return;
  const v=nearestTraffic();
  if(!v){toast('Dekati kendaraan lain');return}
  car.visible=false;
  car=v;car.visible=true;inCar=true;engineOn=true;player.visible=false;
  car.userData.stolen=true;document.querySelector('#mode').textContent='Mengemudi';
  toast('Kendaraan berhasil diambil');syncVehicleUI();
}
function enterExit(){
 if(!inCar&&nearby(player.position,car,9)){ensureAudio();soundBurst('unlock',.07);inCar=true;player.visible=false;document.querySelector('#mode').textContent='Mengemudi';toast('Kamu masuk kendaraan')}
 else if(inCar){ensureAudio();soundBurst('click',.05);inCar=false;player.visible=true;player.position.copy(car.position);player.position.x+=4;document.querySelector('#mode').textContent='Jalan kaki';toast('Kamu keluar kendaraan')}
}
function service(){
 if(!inCar){toast('Naik kendaraan dulu');return}
 const d=car.position.distanceTo(shop.position),g=car.position.distanceTo(gas.position);
 if(d<16&&cash>=25000){cash-=25000;health=100;carHealth=100;speed=0;soundBurst('unlock',.08);toast('Bengkel: kendaraan diperbaiki · Rp25.000')}
 else if(g<16&&cash>=15000){cash-=15000;fuel=100;soundBurst('unlock',.08);toast('SPBU: tangki penuh · Rp15.000')}
 else toast('Dekati BENGKEL atau SPBU')
}
function saveGame(){
 localStorage.setItem('gtaCirebonSave',JSON.stringify({cash,wanted,speed:0,fuel,health,carHealth,mission,gameMinutes,x:car.position.x,z:car.position.z}));
 toast('Game disimpan di perangkat');
}
function loadGame(){
 try{const s=JSON.parse(localStorage.getItem('gtaCirebonSave')||'null');if(!s){toast('Belum ada save');return}
 cash=Number(s.cash)||150000;wanted=Number(s.wanted)||0;fuel=Math.max(0,Math.min(100,Number(s.fuel)||100));health=Math.max(0,Math.min(100,Number(s.health)||100));carHealth=Math.max(0,Math.min(100,Number(s.carHealth)||100));mission=Math.max(1,Number(s.mission)||1);gameMinutes=Number(s.gameMinutes)||720;car.position.set(Number(s.x)||40,0,Number(s.z)||20);inCar=false;player.visible=true;document.querySelector('#mode').textContent='Jalan kaki';setMission();toast('Game dimuat')}
 catch(e){toast('Save rusak atau tidak cocok')}}
function setMission(){
 const x=((mission*53)%280)-140,z=((mission*79)%280)-140;target.position.set(x,.18,z);
 document.querySelector('#mission').innerHTML='MISI '+mission+' · ANTAR PAKET<br><small id="missionText">Titik kuning · hadiah Rp'+missionReward.toLocaleString('id-ID')+'</small>';
}
function completeMission(){
 cash+=missionReward;mission++;
 if(mission%4===0){wanted=Math.min(5,wanted+1);soundBurst('horn',.06);toast('Misi selesai! Polisi mulai mencari kamu ⭐ '+wanted)}
 else toast('Misi selesai! +Rp'+missionReward.toLocaleString('id-ID'));
 setMission();
}
function handleWanted(dt,obj){
 if(wanted<=0)return;
 police.forEach((p,i)=>{
  const to=obj.position.clone().sub(p.position),d=to.length();
  if(d>250)return;
  to.normalize();p.position.add(to.multiplyScalar((.35+wanted*.08)*dt));
  p.lookAt(obj.position.x,p.position.y,obj.position.z);
  if(d<7){health=Math.max(0,health-dt*9);speed*=.82;if(health<=0){cash=Math.max(0,cash-25000);wanted=0;health=70;car.position.set(40,0,20);toast('Kamu tertangkap! Denda Rp25.000')}}
 });
 // wanted slowly falls only when away from police
 if(Math.random()<dt*(wanted>0 ? .035 : 0))wanted=Math.max(0,wanted-1);
}
function updateWorld(dt){
 weatherTimer+=dt;if(weatherTimer>45){weatherTimer=0;cycleWeather()} const wet=weather==='Hujan';sun.intensity*=wet ? .82 : 1;
 gameMinutes=(gameMinutes+dt*2.2)%1440;const hour=gameMinutes/60,day=Math.max(.15,Math.sin((hour-6)/12*Math.PI));
 const sky=new THREE.Color().setHSL(.57,.42,.17+.48*day);scene.background=sky;
const night=1-day;
if(scene.fog)scene.fog.color.copy(sky);
 sun.intensity=(.35+1.9*day)*(weather==='Hujan' ? .72 : weather==='Mendung' ? .88 : 1);hemi.intensity=(.55+1.4*day)*(weather==='Hujan' ? .8 : weather==='Mendung' ? .93 : 1);if(scene.fog)scene.fog.far=weather==='Hujan'?300:620;
 document.querySelector('#clock').textContent=String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.floor(gameMinutes%60)).padStart(2,'0')+(day>.55?' Siang':' Malam');
}
function update(dt){
 const obj=inCar?car:player;
 const gasPressed=pressed('w')||pressed('gas'); const accel=(gasPressed?1:0)-(pressed('s')?1:0),steer=(pressed('a')?1:0)-(pressed('d')?1:0);
 if(inCar){
  const boost=pressed('shift')&&fuel>2;
  const max=boost?95:70;
  const accelRate=boost?42:30;const drag=accel===0?7:1.8;speed+=accel*accelRate*dt-speed*drag*dt;speed=Math.max(-28,Math.min(max,speed));
  if(boost){fuel=Math.max(0,fuel-dt*4.8);if(Math.random()<dt*8)soundBurst('boost',.012)}if(pressed('space')){speed*=.72;if(Math.abs(speed)>18)soundBurst('brake',.018)}
  if(Math.abs(speed)>0.8){const steerRate=(pressed('space')?0.82:1.12)*Math.min(1,Math.abs(speed)/28);car.rotation.y+=steer*steerRate*dt*(speed>=0?1:-1);}const drive=(speed/3.6)*dt;const forward=new THREE.Vector3(0,0,-1).applyQuaternion(car.quaternion);const moved=moveWithCollision(car,forward.x*drive,forward.z*drive,2.35);if(!moved){if(audioReady&&Math.abs(speed)>8&&performance.now()/1000-audioLastImpact>.7){soundBurst('impact',.12);audioLastImpact=performance.now()/1000}speed*=.15;carHealth=Math.max(0,carHealth-Math.abs(speed)*dt*3);if(Math.abs(speed)>.12)toast('🚧 Bangunan menghalangi jalan')}
  fuel=Math.max(0,fuel-Math.abs(speed)*dt*.006);
  if(fuel<=0){speed=0}
  // Keep vehicle inside the playable city.
  car.position.x=Math.max(-178,Math.min(178,car.position.x));car.position.z=Math.max(-178,Math.min(178,car.position.z));
 }else{
  player.rotation.y+=steer*.065;const walk=accel*3.4*dt;const pf=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);moveWithCollision(player,pf.x*walk,pf.z*walk,1.2);
  player.position.x=Math.max(-175,Math.min(175,player.position.x));player.position.z=Math.max(-175,Math.min(175,player.position.z));
 }
 traffic.forEach((c,i)=>{if(c.userData.stolen)return;const v=((c.userData.speed||24)/3.6)*dt*(c.rotation.y?1:-1);c.position.z+=v;const lane=c.userData.laneOffset||0;c.position.x=Math.round(c.position.x/40)*40+lane;if(c.position.z>175)c.position.z=-175;if(c.position.z<-175)c.position.z=175});
 npcs.forEach((n,i)=>{const t=n.userData.target;const dx=t.x-n.position.x,dz=t.z-n.position.z,d=Math.hypot(dx,dz);if(d<2){const pick=(i+Math.floor(performance.now()/4000))%npcRoad.length;t.set(npcRoad[pick],1,npcRoad[(pick+i+3)%npcRoad.length])}else{const step=Math.min(d,.055*dt*60);n.position.x+=dx/d*step;n.position.z+=dz/d*step;n.rotation.y=Math.atan2(dx,-dz)}});
 handleWanted(dt,obj);
 if(obj.position.distanceTo(target.position)<9)completeMission();
 const desired=new THREE.Vector3(0,inCar?9:7,inCar?16:13).applyQuaternion(obj.quaternion).add(obj.position);
 camera.position.lerp(desired,.11);camera.lookAt(obj.position.x,obj.position.y+1.3,obj.position.z);
 const area=obj.position.distanceTo(gas.position)<30?'SPBU':obj.position.distanceTo(shop.position)<30?'Bengkel':obj.position.distanceTo(new THREE.Vector3(-90,0,-90))<35?'Keraton':obj.position.distanceTo(new THREE.Vector3(90,0,-90))<35?'Area Mall':obj.position.distanceTo(new THREE.Vector3(-90,0,90))<35?'Alun-Alun':'Kota';
 document.querySelector('#area').textContent=area;
 document.querySelector('#cash').textContent=Math.floor(cash).toLocaleString('id-ID');document.querySelector('#fuel').textContent=Math.round(fuel);document.querySelector('#wanted').textContent=wanted;document.querySelector('#health').textContent=Math.round(health);
 updateMap(obj);updateWorld(dt);updateAudio(dt);updateRealAudio();syncVehicleUI();updateContextControls();document.querySelector('#weather').textContent=weather==='Hujan'?'🌧️ Hujan':weather==='Mendung'?'☁️ Mendung':'☀️ Cerah';
}
function updateMap(obj){
 const c=document.querySelector('#map'),ctx=c.getContext('2d'),w=c.width,h=c.height,s=280/128;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#1e3a27';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#555';ctx.lineWidth=5;
 for(let p=-140;p<=140;p+=40){const q=64+p/s;ctx.beginPath();ctx.moveTo(q,0);ctx.lineTo(q,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,q);ctx.lineTo(w,q);ctx.stroke()}
 const dot=(x,z,color,r=3)=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(64+x/s,64+z/s,r,0,Math.PI*2);ctx.fill()};
 dot(target.position.x,target.position.z,'#ffd21a',4);dot(gas.position.x,gas.position.z,'#20e060',3);dot(shop.position.x,shop.position.z,'#2ea8ff',3);
 police.forEach(p=>{if(p.position.distanceTo(obj.position)<130)dot(p.position.x,p.position.z,'#ff4545',2)});
 dot(obj.position.x,obj.position.z,'#37a8ff',4);
}
function keyDown(e){ensureAudio();
 const k=e.key.toLowerCase();if(e.key===' ')keys.add('space');else if(e.key==='shift')keys.add('shift');else keys.add(k);
 if(k==='e')enterExit();if(k==='r')service();if(k==='f5')saveGame();if(k==='f9')loadGame();
}
addEventListener('keydown',keyDown);addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(e.key===' ')keys.delete('space');if(e.key==='shift')keys.delete('shift')});
document.querySelectorAll('button[data-k]').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();ensureAudio();keys.add(k);if(k==='gas')keys.add('w')};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>{keys.delete(k);if(k==='gas')keys.delete('w')}});
document.querySelectorAll('button[data-action]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();const a=b.dataset.action;if(a==='enter')enterExit();if(a==='steal')stealNearestCar();if(a==='repair')service()}});
setMission();buildWeatherFX();syncVehicleUI();ensureAudio();
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

}catch(err){
  const boot=document.querySelector("#boot-status");
  if(boot){boot.textContent="Game gagal memuat: "+(err.message||err);boot.style.color="#ff8080";}
  console.error(err);
}
})();
</script>
</body>
