name: NPC Upgrade
on:
  push:
    paths:
      - '.github/workflows/npc-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker="let cash=150000,wanted=0,speed=0,fuel=100,health=100,mission=1,gameMinutes=720,carHealth=100,engineOn=false,weather='Cerah',weatherTimer=0;"
          helper=r'''\nfunction updateSafeNpc(n,i,dt,now){\n const u=n.userData;if(!n.visible)return;if(!u.safeAxis){u.safeAxis=i%2?'h':'v';u.safeRoad=npcRoad[i%npcRoad.length];u.safeSide=i%2?-7.2:7.2;u.safeDir=i%3===0?-1:1;}\n const axis=u.safeAxis,side=u.safeSide;u.safeRoad=Math.round(u.safeRoad/40)*40;\n if(axis==='v'){n.position.x=u.safeRoad+side;n.position.z+=u.safeDir*.9*dt;if(n.position.z>166||n.position.z<-166){n.position.z=Math.max(-166,Math.min(166,n.position.z));u.safeAxis='h';u.safeRoad=Math.round(n.position.z/40)*40;u.safeDir=i%4<2?1:-1;}}\n else{n.position.z=u.safeRoad+side;n.position.x+=u.safeDir*.9*dt;if(n.position.x>166||n.position.x<-166){n.position.x=Math.max(-166,Math.min(166,n.position.x));u.safeAxis='v';u.safeRoad=Math.round(n.position.x/40)*40;u.safeDir=i%4<2?-1:1;}}\n n.position.y=0;n.rotation.y=axis==='v'?(u.safeDir>0?0:Math.PI):(u.safeDir>0?Math.PI/2:-Math.PI/2);\n if(u.activity==='talk'||u.activity==='phone'||u.activity==='wait'){animateHuman(n,now+u.walkPhase,false);if(u.activity==='phone'&&u.parts)u.parts.armR.rotation.x=-.9;u.activityTimer-=dt;if(u.activityTimer<=0)u.activity='walk';return;}\n if(Math.random()<dt*.018){u.activity=['walk','phone','wait','talk'][Math.floor(Math.random()*4)];u.activityTimer=2+Math.random()*4;}animateHuman(n,now+u.walkPhase,true);\n}\n'''
          if 'function updateSafeNpc(' not in s:s=s.replace(marker,marker+helper)
          s=s.replace("n.userData.activityTimer-=dt;\n   const side=", "n.userData.activityTimer-=dt;\n   if(n.userData.workState==='inside'||n.userData.workState==='driving'||n.userData.workState==='rest') n.userData.workTimer-=dt;\n   const side=")
          s=s.replace("if(!n.visible)return;\n\n   // Interaksi sosial nyata:", "if(!n.visible)return;\n   if(role==='warga'){updateSafeNpc(n,i,dt,now);return;}\n\n   // Interaksi sosial nyata:")
          s=s.replace("const roadXs=[-160,-120,-80,-40,0,40,80,120,160];\nconst carTypes=", "const roadXs=[-160,-120,-80,-40,0,40,80,120,160];\nconst roadZs=[-160,-120,-80,-40,0,40,80,120,160];\nconst carTypes=")
          s=s.replace("const c=makeCar(roadX+lane,-178+(i%25)*14.4,cc,false,type);\n c.rotation.y=i%2?Math.PI:0;\n c.userData.speed=30+(i%9)*2.4;\n c.userData.stolen=false;\n c.userData.laneOffset=lane;\n c.userData.direction=i%2?1:-1;",
"const horizontal=i%2===1;const roadCoord=horizontal?roadZs[Math.floor(i/2)%roadZs.length]:roadX;const lane2=i%4<2?-2.5:2.5;const start=-178+(i%18)*19.7;const c=makeCar(horizontal?start:roadCoord+lane2,horizontal?roadCoord+lane2:start,cc,false,type);c.rotation.y=horizontal?(i%4<2?Math.PI/2:-Math.PI/2):(i%4<2?Math.PI:0);c.userData.speed=30+(i%9)*2.4;c.userData.stolen=false;c.userData.laneOffset=lane2;c.userData.direction=i%4<2?1:-1;c.userData.axis=horizontal?'x':'z';")
          s=s.replace("const v=((c.userData.speed||38)/3.6)*dt*(c.userData.direction||1);\n   c.position.z+=v;\n   const lane=c.userData.laneOffset||0;\n   c.position.x=Math.round(c.position.x/40)*40+lane;\n   if(c.position.z>180)c.position.z=-180;\n   if(c.position.z<-180)c.position.z=180;",
"const v=((c.userData.speed||38)/3.6)*dt*(c.userData.direction||1);const lane=c.userData.laneOffset||0;if(c.userData.axis==='x'){c.position.x+=v;c.position.z=Math.round(c.position.z/40)*40+lane;if(c.position.x>180)c.position.x=-180;if(c.position.x<-180)c.position.x=180;}else{c.position.z+=v;c.position.x=Math.round(c.position.x/40)*40+lane;if(c.position.z>180)c.position.z=-180;if(c.position.z<-180)c.position.z=180;}")
          p.write_text(s)
          PY
      - name: Check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); Path('/tmp/game.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/game.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fix NPC sidewalk routing and upgrade traffic' && git push)
          git rm -f .github/workflows/npc-upgrade.yml || true
          git commit -m 'Remove temporary NPC upgrade workflow' || true
          git push || true
